<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleMoney</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0b0b">
    <link rel="apple-touch-icon" href="icons/icon-512.png">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f14;
            --surface-card: #151b23;
            --surface-card-hover: #1a222c;
            --surface-active: #162232;
            --text-main: #f0f6fc;
            --text-dim: #768390;
            --text-muted: #57606a;
            --border-color: #212833;
            --accent-blue: #58a6ff;
            --recording-color: #ff4444;
            --danger-color: #ff7b72;
            --hover-color: #ffffff;
            --fs-scale: 1.05;
            --radius: 16px;
            --radius-sm: 10px;
        }

        /* ══════════════════════════════════════
           MINIMAL & MINIMAL FLAT THEME ENGINE
           ══════════════════════════════════════ */
        :is([data-theme="minimal"], [data-theme="minimal_dark"]) {
            --bg-color: var(--bg);
            --text-main: var(--text-hi);
            --text-dim: var(--dim);
            --border-color: var(--hr);
            --hover-color: var(--text-hi);
        }

        :is([data-theme="minimal"], [data-theme="minimal_dark"]) #app-container {
            border: 2px solid var(--hr) !important;
            padding: 28px 20px !important;
            background: var(--surface) !important;
            box-shadow: none !important;
        }

        :is([data-theme="minimal"], [data-theme="minimal_dark"]) input[type="number"],
        :is([data-theme="minimal"], [data-theme="minimal_dark"]) textarea {
            background: var(--surface2) !important;
            border: 2px solid var(--hr) !important;
            color: var(--text-hi) !important;
            box-shadow: none !important;
        }

        :is([data-theme="minimal"], [data-theme="minimal_dark"]) input.bill-amount-input {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        :is([data-theme="minimal"], [data-theme="minimal_dark"]) button {
            background: var(--accent) !important;
            border: 2px solid var(--accent) !important;
            color: var(--on-accent) !important;
            font-weight: 600 !important;
            box-shadow: none !important;
        }

        :is([data-theme="minimal"], [data-theme="minimal_dark"]) button.secondary {
            background: transparent !important;
            border: 2px solid var(--hr) !important;
            color: var(--text-hi) !important;
        }

        :is([data-theme="minimal"], [data-theme="minimal_dark"]) .icon-btn {
            background: transparent !important;
            border: none !important;
            color: var(--text-dim) !important;
            box-shadow: none !important;
        }

        :is([data-theme="minimal"], [data-theme="minimal_dark"]) input[type="checkbox"] {
            border: 2px solid var(--hr) !important;
            background: var(--surface) !important;
        }

        :is([data-theme="minimal"], [data-theme="minimal_dark"]) input[type="checkbox"]::before {
            box-shadow: inset 1em 1em var(--text-hi) !important;
        }

        :is([data-theme="minimal"], [data-theme="minimal_dark"]) .ai-output-card {
            border: 2px solid var(--hr) !important;
            background: var(--surface2) !important;
        }

        :is([data-theme="minimal"], [data-theme="minimal_dark"]) .header-text {
            border-bottom: 2px solid var(--hr) !important;
        }

        :is([data-theme="minimal"], [data-theme="minimal_dark"]) .section-label {
            border-bottom: 2px solid var(--hr) !important;
        }

        :is([data-theme="minimal"], [data-theme="minimal_dark"]) #theme-select {
            border: 2px solid var(--hr) !important;
            background: var(--surface2) !important;
            color: var(--text-hi) !important;
        }

        :is([data-theme="minimal"], [data-theme="minimal_dark"]) #expanded-panel {
            border-top: 2px solid var(--hr) !important;
        }

        .size-btn {
            padding: 6px 14px;
            font-size: 0.75em;
            font-weight: 600;
            min-width: auto !important;
            cursor: pointer;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: var(--radius-sm);
        }
        .size-btn.active {
            background: var(--text-main);
            color: var(--bg-color);
            border-color: var(--text-main);
        }

        :is([data-theme="minimal"], [data-theme="minimal_dark"]) .size-btn {
            background: transparent !important;
            border: 2px solid var(--hr) !important;
            color: var(--text-hi) !important;
            font-weight: 600;
        }
        :is([data-theme="minimal"], [data-theme="minimal_dark"]) .size-btn.active {
            background: var(--accent) !important;
            border-color: var(--accent) !important;
            color: var(--on-accent) !important;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 16px 16px 115px 16px;
            font-size: calc(16px * var(--fs-scale));
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        #app-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Top Brand Header */
        .top-brand-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 2px 2px 2px;
        }

        .brand-title {
            font-size: 0.82em;
            font-weight: 700;
            letter-spacing: 0.18em;
            color: #8b949e;
            text-transform: uppercase;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-icon-btn {
            background: transparent;
            border: none;
            color: #8b949e;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: auto !important;
            flex: none !important;
            transition: color 0.15s ease;
        }

        .top-icon-btn:hover {
            color: #ffffff;
        }

        /* Cycle Selector Cards */
        .cycle-cards-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 2px 8px 2px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .cycle-cards-scroll::-webkit-scrollbar { display: none; }

        .cycle-card {
            flex: 1 0 135px;
            min-width: 135px;
            background: var(--surface-card);
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.18s ease;
            user-select: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .cycle-card.active {
            background: var(--surface-active);
            border-color: #58a6ff;
            box-shadow: 0 0 0 1px #58a6ff, 0 4px 14px rgba(88, 166, 255, 0.15);
        }

        .cycle-card-title {
            font-size: 0.72em;
            font-weight: 600;
            color: #8b949e;
            margin-bottom: 2px;
        }

        .cycle-card.active .cycle-card-title {
            color: #a8c7fa;
        }

        .cycle-card-dates {
            font-size: 0.68em;
            color: #636e7d;
            margin-bottom: 8px;
            white-space: nowrap;
        }

        .cycle-card-amount {
            font-size: 1.22em;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        /* Hero Section */
        .hero-section {
            display: flex;
            flex-direction: column;
            padding: 6px 2px 2px 2px;
            gap: 3px;
        }

        .hero-label {
            font-size: 0.72em;
            font-weight: 700;
            color: #768390;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .hero-amount {
            font-size: 3.2em;
            font-weight: 800;
            letter-spacing: -1.5px;
            color: #ffffff;
            line-height: 1.05;
        }

        .hero-subtext {
            font-size: 0.9em;
            font-weight: 600;
            color: #768390;
            margin-top: 1px;
        }

        .progress-track {
            width: 100%;
            height: 7px;
            background: #1f2733;
            border-radius: 999px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: #79a8d8;
            border-radius: 999px;
            transition: width 0.3s ease;
        }

        .progress-stats-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.76em;
            font-weight: 600;
            color: #768390;
            margin-top: 5px;
        }

        /* Balance Card in Current cycle */
        .balance-card {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-top: 2px;
        }

        .balance-card-label {
            font-size: 0.68em;
            font-weight: 700;
            color: #768390;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .balance-input-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .balance-currency {
            font-size: 1.25em;
            font-weight: 700;
            color: #768390;
        }

        #balance-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 1.3em;
            font-weight: 800;
            padding: 0;
            outline: none;
            width: 100%;
            font-family: inherit;
        }

        /* Section Headings */
        .section-group-label {
            font-size: 0.72em;
            font-weight: 700;
            color: #768390;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin: 14px 2px 8px 2px;
        }

        #bills-list {
            display: flex;
            flex-direction: column;
        }

        /* Bill Card Items */
        .bill-card-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            margin-bottom: 8px;
            transition: background 0.15s ease, opacity 0.15s ease;
        }

        .bill-card-item:hover {
            background: var(--surface-card-hover);
        }

        .bill-card-item.paid {
            opacity: 0.52;
        }

        .bill-card-item.paid .bill-card-name {
            text-decoration: line-through;
            color: var(--text-dim);
        }

        .bill-card-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        /* Dot icon for weekly/flexible bills */
        .category-dot {
            width: 16px;
            height: 16px;
            border-radius: 5px;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.12s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .category-dot:active {
            transform: scale(0.85);
        }

        /* Date tile for monthly bills */
        .date-tile {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: #1f2733;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            user-select: none;
            position: relative;
            overflow: hidden;
            transition: transform 0.12s ease;
        }
        .date-tile:active {
            transform: scale(0.9);
        }
        .date-tile-month {
            font-size: 0.62em;
            font-weight: 700;
            color: #8b949e;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 2px;
        }
        .date-tile-day {
            font-size: 0.95em;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
        }

        .bill-card-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .bill-card-name {
            font-size: 0.96em;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bill-card-subtitle {
            font-size: 0.72em;
            font-weight: 500;
            color: var(--text-dim);
        }

        .overdue-text { color: var(--danger-color) !important; font-weight: 700 !important; }

        .bill-card-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .bill-card-amount-wrap {
            display: flex;
            align-items: center;
            font-size: 1.02em;
            font-weight: 700;
            color: var(--text-main);
        }

        .bill-amount-input {
            width: 58px !important;
            flex-shrink: 0;
            padding: 0 !important;
            text-align: right;
            font-size: 1em !important;
            font-weight: 700 !important;
            border: none !important;
            border-radius: 0 !important;
            background: transparent !important;
            box-shadow: none !important;
            outline: none !important;
            color: inherit !important;
            font-family: inherit;
        }

        .bill-amount-input::-webkit-outer-spin-button,
        .bill-amount-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .bill-amount-input[type=number] {
            -moz-appearance: textfield;
        }

        .push-btn {
            background: #4a90e2;
            border: none;
            color: #ffffff;
            width: 28px;
            height: 28px;
            flex: 0 0 28px;
            min-width: 0;
            flex-shrink: 0;
            border-radius: 8px;
            padding: 0;
            margin: 0;
            font-size: 0.85em;
            line-height: 1;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.15s ease;
        }
        .push-btn:hover {
            opacity: 0.85;
        }

        .push-btn-return {
            background: #203347;
            color: #7eb3f7;
            border: 1px solid #4a90e2;
        }

        .chevron-icon {
            color: #57606a;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Bottom Nav Bar */
        .bottom-nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            min-height: 70px;
            background: rgba(13, 17, 23, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid #1f2733;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 16px;
            padding-bottom: max(14px, env(safe-area-inset-bottom, 14px));
            z-index: 100;
            max-width: 440px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .master-bill-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            gap: 8px;
        }

        .master-bill-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }

        .master-bill-name {
            font-size: 0.92em;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .master-bill-meta {
            font-size: 0.72em;
            color: var(--text-dim);
        }

        .master-bill-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .delete-bill-btn {
            background: transparent;
            border: none;
            color: #f85149;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: background 0.15s ease;
            min-width: auto !important;
            flex: none !important;
        }

        .delete-bill-btn:hover {
            background: rgba(248, 81, 73, 0.15);
        }

        .nav-tab-btn {
            background: transparent;
            border: none;
            color: #768390;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 12px;
            font-family: inherit;
            transition: color 0.15s ease;
            min-width: auto !important;
            flex: none !important;
        }

        .nav-tab-btn.active {
            color: #ffffff;
        }

        .nav-tab-btn.active .nav-tab-icon-wrap {
            background: #1f2733;
            border-radius: 14px;
            padding: 4px 14px;
        }

        .nav-tab-label {
            font-size: 0.72em;
            font-weight: 600;
        }

        .floating-add-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #a8c7fa;
            color: #0b1320;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(168, 199, 250, 0.28);
            transition: transform 0.15s ease, background 0.15s ease;
            flex: none !important;
            min-width: auto !important;
        }

        .floating-add-btn:hover {
            transform: scale(1.06);
            background: #bdd7ff;
        }

        /* Modal Overlay & Bottom Sheets */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 200;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-sheet {
            background: #151b23;
            border: 1px solid #252e3b;
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-width: 440px;
            padding: 22px 20px 36px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.22s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 1.1em;
            font-weight: 700;
            color: #ffffff;
        }

        .modal-close-btn {
            background: transparent;
            border: none;
            color: #768390;
            font-size: 1.4em;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
            min-width: auto !important;
            flex: none !important;
        }
        .modal-close-btn:hover { color: #ffffff; }

        .modal-sheet input[type="text"],
        .modal-sheet input[type="number"],
        .modal-sheet textarea {
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95em;
            padding: 12px 14px;
            width: 100%;
            outline: none;
            border-radius: var(--radius-sm);
        }

        .modal-sheet textarea {
            height: 90px;
            resize: vertical;
        }

        .action-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            background: #58a6ff;
            color: #0b1320;
            border: none;
            padding: 12px 18px;
            font-family: inherit;
            font-size: 0.88em;
            font-weight: 700;
            cursor: pointer;
            border-radius: var(--radius-sm);
            flex: 1;
            min-width: 100px;
            transition: opacity 0.15s ease;
        }

        button.secondary {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        button.recording {
            color: var(--recording-color);
            border-color: var(--recording-color);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .add-bill-row {
            display: flex;
            gap: 8px;
        }

        .add-bill-row input {
            flex: 1;
            min-width: 0;
        }

        .add-bill-type-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85em;
            color: var(--text-dim);
            cursor: pointer;
        }

        .ai-output-card {
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            margin-top: 8px;
            font-size: 0.88em;
            line-height: 1.5;
            background: #0d1117;
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .settings-label {
            font-size: 0.75em;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        #theme-select {
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-family: inherit;
            font-weight: 500;
            font-size: 0.8em;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            outline: none;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <div id="app-container">
        <!-- Top Brand Bar -->
        <div class="top-brand-bar">
            <div class="brand-title" style="display: flex; align-items: center; gap: 7px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: #58a6ff;"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M15 9.5a3.5 3.5 0 0 0-7 0c0 2 1.5 3 3.5 3s3.5 1 3.5 3a3.5 3.5 0 0 1-7 0"/></svg>
                SIMPLE MONEY
            </div>
            <div class="top-actions">
                <button class="top-icon-btn" onclick="toggleOverviewModal(true)" title="Settings & Overview">

    <script>
        // --- 0. API CONFIGURATION ---
        const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY";

        function getApiKey() {
            let key = localStorage.getItem('gemini-api-key');
            if (!key || key === "YOUR_GEMINI_API_KEY") {
                key = prompt("Please enter your Gemini API Key (starts with AIzaSy...):");
                if (key) {
                    key = key.trim();
                    localStorage.setItem('gemini-api-key', key);
                }
            }
            return key || GEMINI_API_KEY;
        }

        function promptNewApiKey() {
            localStorage.removeItem('gemini-api-key');
            const newKey = prompt("Please enter your Gemini API Key (starts with AIzaSy...):");
            if (newKey) {
                localStorage.setItem('gemini-api-key', newKey.trim());
                executeLiveTextQuery();
            }
        }

        function deleteApiKey() {
            localStorage.removeItem('gemini-api-key');
            const container = document.getElementById("ai-response-container");
            if (container) {
                container.innerHTML = `<div class="ai-output-card" style="color:var(--text-dim);">Gemini API Key removed.</div>`;
            }
            alert("Saved Gemini API Key deleted!");
        }

        // --- 1. CORE STATE ---
        const state = {
            currentBalance: 0.00,
            cycleStart: null,
            cycleEnd: null,
            daysRemaining: 14,
            currentCycleIndex: 0,
            viewOffset: 0,

            biweeklyExpenses: [
                { id: 'bw_1', name: "Groceries", amount: 200.00 },
                { id: 'bw_2', name: "Buffer", amount: 100.00 },
                { id: 'bw_3', name: "NA Beer", amount: 60.00 }
            ],

            monthlyExpenses: [
                { id: 'm_1', name: "Rent + buffer", amount: 1050.00, dueDay: 1 },
                { id: 'm_2', name: "Daycare", amount: 220.00, dueDay: 1 },
                { id: 'm_3', name: "Cafe Liegeois", amount: 25.00, dueDay: 7 },
                { id: 'm_4', name: "Purchase Interest", amount: 60.00, dueDay: 10 },
                { id: 'm_5', name: "Iegeek", amount: 5.00, dueDay: 10 },
                { id: 'm_6', name: "Medication", amount: 26.00, dueDay: 10 },
                { id: 'm_7', name: "Rogers", amount: 170.00, dueDay: 14 },
                { id: 'm_8', name: "Spotify", amount: 28.00, dueDay: 15 },
                { id: 'm_9', name: "Amazon Prime", amount: 12.00, dueDay: 18 },
                { id: 'm_10', name: "PlayStation", amount: 15.00, dueDay: 19 },
                { id: 'm_11', name: "Fizz internet", amount: 53.00, dueDay: 22 },
                { id: 'm_12', name: "Amazon Subscription", amount: 12.00, dueDay: 24 },
                { id: 'm_13', name: "Monitor loan", amount: 130.00, dueDay: 26 }
            ],

            deferredBills: [],
            paidBills: [],
            customAmounts: {}
        };

        // --- 2. TIME ENGINE ---
        const BASE_PAYDAY = new Date('2026-07-17T00:00:00');

        function updateCycleEngine() {
            const today = new Date();
            const msPerDay = 1000 * 60 * 60 * 24;

            const diffTime = today.getTime() - BASE_PAYDAY.getTime();
            const totalDaysSinceAnchor = Math.floor(diffTime / msPerDay);

            state.currentCycleIndex = Math.floor(totalDaysSinceAnchor / 14);
            const daysIntoCurrentCycle = totalDaysSinceAnchor % 14;
            state.daysRemaining = 14 - daysIntoCurrentCycle;

            state.cycleStart = new Date(today.getTime() - (daysIntoCurrentCycle * msPerDay));
            state.cycleEnd = new Date(today.getTime() + (state.daysRemaining * msPerDay));

            renderCycleHeaders();
        }

        function renderCycleHeaders() {
            const msPerDay = 1000 * 60 * 60 * 24;
            const formatDate = (d) => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

            const cycles = [0, 1, 2].map(offset => {
                const start = new Date(state.cycleStart.getTime() + (offset * 14 * msPerDay));
                const end = new Date(start.getTime() + (14 * msPerDay));
                const inclusiveEnd = new Date(start.getTime() + (13 * msPerDay));
                const cycleData = getExpensesForViewedCycle(offset);
                const sum = Math.round(cycleData.totalBillsSum);
                return { offset, start, end, inclusiveEnd, sum };
            });

            const headerHTML = cycles.map(c => {
                const isSelected = c.offset === state.viewOffset;
                let title = "Current cycle";
                if (c.offset === 1) title = "Next cycle";
                else if (c.offset === 2) title = "Following cycle";

                return `
                    <div class="cycle-card ${isSelected ? 'active' : ''}" onclick="setViewCycle(${c.offset})">
                        <div class="cycle-card-title">${title}</div>
                        <div class="cycle-card-dates">${formatDate(c.start)} – ${formatDate(c.inclusiveEnd)}</div>
                        <div class="cycle-card-amount">$${c.sum.toLocaleString()}</div>
                    </div>
                `;
            }).join('');

            const headerEl = document.getElementById("cycle-header");
            if (headerEl) headerEl.innerHTML = headerHTML;
        }

        function setViewCycle(offset) {
            state.viewOffset = (offset >= 0 && offset <= 2) ? offset : 0;
            renderCycleHeaders();
            recalculateCashFlow();
        }

        // --- 3. LOOK-AHEAD ALGORITHM ---
        function getExpensesForViewedCycle(targetOffset = state.viewOffset) {
            let cycleLiability = 0;
            let totalBillsSum = 0;
            let activeBills = [];
            const msPerDay = 1000 * 60 * 60 * 24;
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const currentCycleStart = state.cycleStart;
            const currentCycleEnd = state.cycleEnd;
            const targetCycleStart = new Date(state.cycleStart.getTime() + (targetOffset * 14 * msPerDay));
            const targetCycleEnd = new Date(targetCycleStart.getTime() + (14 * msPerDay));

            const viewCycleIndex = state.currentCycleIndex + targetOffset;

            state.biweeklyExpenses.forEach(exp => {
                const instanceId = `${exp.id}_cycle_${viewCycleIndex}`;
                const isPaid = state.paidBills.includes(instanceId);
                const amount = (state.customAmounts && state.customAmounts[instanceId] !== undefined)
                    ? state.customAmounts[instanceId]
                    : exp.amount;

                totalBillsSum += amount;
                if (!isPaid) {
                    cycleLiability += amount;
                }
                activeBills.push({...exp, amount, id: instanceId, isBiweekly: true});
            });

            const maxForecastEnd = new Date(state.cycleStart.getTime() + (3 * 14 * msPerDay));
            let startMonthYear = { m: BASE_PAYDAY.getMonth(), y: BASE_PAYDAY.getFullYear() };
            let endMonthYear = { m: maxForecastEnd.getMonth(), y: maxForecastEnd.getFullYear() };

            let currentLoopDate = new Date(startMonthYear.y, startMonthYear.m, 1);
            let endLoopDate = new Date(endMonthYear.y, endMonthYear.m + 1, 1);

            while (currentLoopDate < endLoopDate) {
                const m = currentLoopDate.getMonth();
                const y = currentLoopDate.getFullYear();

                state.monthlyExpenses.forEach(exp => {
                    let billDate = new Date(y, m, exp.dueDay);
                    billDate.setHours(0, 0, 0, 0);

                    if (billDate >= BASE_PAYDAY) {
                        const instanceId = `${exp.id}_${y}_${m}`;
                        const isPaid = state.paidBills.includes(instanceId);
                        const isDeferred = state.deferredBills.includes(instanceId);
                        const amount = (state.customAmounts && state.customAmounts[instanceId] !== undefined)
                            ? state.customAmounts[instanceId]
                            : exp.amount;

                        const isDueInThisCycle = billDate >= targetCycleStart && billDate < targetCycleEnd;
                        const isDueInCurrent = billDate >= currentCycleStart && billDate < currentCycleEnd;
                        const isOverdue = billDate < currentCycleStart && !isPaid;
                        const isCurrentCandidate = isDueInCurrent || isOverdue;

                        if (targetOffset === 0) {
                            // Current cycle: shows unpaid overdue bills and current bills that have NOT been pushed
                            if (isCurrentCandidate && !isDeferred) {
                                totalBillsSum += amount;
                                if (!isPaid) {
                                    cycleLiability += amount;
                                }

                                activeBills.push({
                                    ...exp,
                                    amount,
                                    id: instanceId,
                                    isBiweekly: false,
                                    originalDate: billDate,
                                    isOverdue: (billDate < today && !isPaid),
                                    isPushed: false
                                });
                            }
                        } else if (targetOffset === 1) {
                            // Next cycle: shows bills naturally falling in next cycle PLUS bills pushed forward from current cycle
                            const isPushedFromCurrent = isCurrentCandidate && isDeferred;
                            if (isDueInThisCycle || isPushedFromCurrent) {
                                totalBillsSum += amount;
                                if (!isPaid) {
                                    cycleLiability += amount;
                                }

                                activeBills.push({
                                    ...exp,
                                    amount,
                                    id: instanceId,
                                    isBiweekly: false,
                                    originalDate: billDate,
                                    isOverdue: false,
                                    isPushed: isPushedFromCurrent
                                });
                            }
                        } else {
                            // Following cycle (offset 2): shows bills naturally falling in this cycle
                            if (isDueInThisCycle) {
                                totalBillsSum += amount;
                                if (!isPaid) {
                                    cycleLiability += amount;
                                }

                                activeBills.push({
                                    ...exp,
                                    amount,
                                    id: instanceId,
                                    isBiweekly: false,
                                    originalDate: billDate,
                                    isOverdue: false,
                                    isPushed: false
                                });
                            }
                        }
                    }
                });
                currentLoopDate.setMonth(currentLoopDate.getMonth() + 1);
            }

            activeBills.sort((a, b) => {
                if (a.isOverdue && !b.isOverdue) return -1;
                if (!a.isOverdue && b.isOverdue) return 1;
                if (a.isBiweekly && !b.isBiweekly) return -1;
                if (!a.isBiweekly && b.isBiweekly) return 1;
                if (a.originalDate && b.originalDate) return a.originalDate - b.originalDate;
                return 0;
            });

            return { total: cycleLiability, totalBillsSum, list: activeBills };
        }

        // --- 4. CALCULATION & UI UPDATE ---
        function updateAmount(instanceId, val) {
            const newAmount = parseFloat(val);
            if (isNaN(newAmount)) return;

            if (!state.customAmounts) state.customAmounts = {};
            state.customAmounts[instanceId] = newAmount;

            renderCycleHeaders();
            recalculateCashFlow();
            saveStateToLocalStorage();
            if (window.saveStateToFirebase) window.saveStateToFirebase();
        }

        function recalculateCashFlow() {
            const cycleData = getExpensesForViewedCycle();
            const isUpcoming = state.viewOffset > 0;
            const cycleTitle = state.viewOffset === 0 ? "Current cycle" : (state.viewOffset === 1 ? "Next cycle" : "Following cycle");

            // 1. Progress Bar & Bill Counts
            const totalCount = cycleData.list.length;
            const paidCount = cycleData.list.filter(b => state.paidBills.includes(b.id)).length;
            const pct = totalCount > 0 ? Math.round((paidCount / totalCount) * 100) : 0;

            const progressFillEl = document.getElementById("progress-fill");
            const progressCountEl = document.getElementById("progress-count-label");
            const progressPctEl = document.getElementById("progress-pct-label");
            if (progressFillEl) progressFillEl.style.width = `${pct}%`;
            if (progressCountEl) progressCountEl.innerText = `${paidCount} of ${totalCount} bills paid`;
            if (progressPctEl) progressPctEl.innerText = `${pct}%`;

            // 2. Financial Metrics & Hero Section
            const startingIncome = state.viewOffset === 0 ? state.currentBalance : 0;
            let disposableLiquidity = startingIncome - cycleData.total;
            let daysDivisor = state.viewOffset === 0 ? state.daysRemaining : 14;
            let safeToSpendDaily = disposableLiquidity / daysDivisor;

            const heroStatusEl = document.getElementById("hero-status-label");
            const heroAmountEl = document.getElementById("hero-amount");
            const heroSubtextEl = document.getElementById("hero-subtext");
            const balContainer = document.getElementById("balance-card-container");
            const balInput = document.getElementById("balance-input");

            if (isUpcoming) {
                if (heroStatusEl) heroStatusEl.innerText = "UPCOMING BILLS";
                if (heroAmountEl) {
                    heroAmountEl.innerText = `$${Math.round(cycleData.total).toLocaleString()}`;
                    heroAmountEl.style.color = "#ffffff";
                }
                if (heroSubtextEl) heroSubtextEl.innerText = `${cycleTitle} · Total bills: $${Math.round(cycleData.totalBillsSum).toLocaleString()}`;
                if (balContainer) balContainer.style.display = "none";
            } else {
                if (balContainer) balContainer.style.display = "flex";
                if (balInput) {
                    balInput.disabled = false;
                    balInput.value = state.currentBalance !== 0 ? state.currentBalance : '';
                }

                if (!state.currentBalance || state.currentBalance === 0) {
                    if (heroStatusEl) heroStatusEl.innerText = "CYCLE TOTAL";
                    if (heroAmountEl) {
                        heroAmountEl.innerText = `$${Math.round(cycleData.total).toLocaleString()}`;
                        heroAmountEl.style.color = "#ffffff";
                    }
                    if (heroSubtextEl) heroSubtextEl.innerText = "Enter balance to calculate daily safe spend";
                } else if (disposableLiquidity < 0) {
                    if (heroStatusEl) heroStatusEl.innerText = "SHORTFALL";
                    if (heroAmountEl) {
                        heroAmountEl.innerText = `-$${Math.abs(Math.round(disposableLiquidity)).toLocaleString()}`;
                        heroAmountEl.style.color = "var(--danger-color)";
                    }
                    if (heroSubtextEl) heroSubtextEl.innerText = "Deficit: liabilities exceed current balance";
                } else {
                    if (heroStatusEl) heroStatusEl.innerText = "SAFE TO SPEND";
                    if (heroAmountEl) {
                        heroAmountEl.innerText = `$${Math.round(disposableLiquidity).toLocaleString()}`;
                        heroAmountEl.style.color = "#ffffff";
                    }
                    if (heroSubtextEl) heroSubtextEl.innerText = `$${Math.round(safeToSpendDaily).toLocaleString()} / day · ${state.daysRemaining} days left`;
                }
            }

            // 3. Render Categorized Card-based Bills (WEEKLY & UPCOMING)
            const listEl = document.getElementById("bills-list");
            listEl.innerHTML = '';

            if (cycleData.list.length === 0) {
                listEl.innerHTML = '<div class="bill-card-item" style="color:var(--text-dim); justify-content:center; padding:18px;">No bills in this cycle</div>';
                return;
            }

            const unpaidWeekly = cycleData.list.filter(b => b.isBiweekly && !state.paidBills.includes(b.id));
            const unpaidUpcoming = cycleData.list.filter(b => !b.isBiweekly && !state.paidBills.includes(b.id));
            const paidBills = cycleData.list.filter(b => state.paidBills.includes(b.id));

            // Sort unpaid upcoming: overdue first, then earliest due date
            unpaidUpcoming.sort((a, b) => {
                if (a.isOverdue && !b.isOverdue) return -1;
                if (!a.isOverdue && b.isOverdue) return 1;
                if (a.originalDate && b.originalDate) return a.originalDate - b.originalDate;
                return 0;
            });

            // Sort paid bills: biweekly first, then by date
            paidBills.sort((a, b) => {
                if (a.isBiweekly && !b.isBiweekly) return -1;
                if (!a.isBiweekly && b.isBiweekly) return 1;
                if (a.originalDate && b.originalDate) return a.originalDate - b.originalDate;
                return 0;
            });

            const getDotColor = (name) => {
                const lower = name.toLowerCase();
                if (lower.includes('groc')) return '#3fb950'; // green
                if (lower.includes('beer') || lower.includes('alcohol')) return '#d29922'; // amber
                if (lower.includes('buffer')) return '#8b949e'; // muted gray
                if (lower.includes('gas') || lower.includes('fuel')) return '#f0883e'; // orange
                return '#58a6ff'; // accent blue
            };

            const renderBillCard = (bill, isPaid) => {
                const card = document.createElement('div');
                card.className = `bill-card-item ${isPaid ? 'paid' : ''}`;

                if (bill.isBiweekly) {
                    const dotColor = getDotColor(bill.name);
                    const checkMark = isPaid ? `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>` : '';
                    card.innerHTML = `
                        <div class="bill-card-left">
                            <div class="category-dot" style="background:${dotColor};" onclick="togglePaid('${bill.id}')" title="Click to mark as ${isPaid ? 'unpaid' : 'paid'}">
                                ${checkMark}
                            </div>
                            <div class="bill-card-info" onclick="togglePaid('${bill.id}')" style="cursor:pointer;">
                                <div class="bill-card-name">${bill.name}</div>
                                <div class="bill-card-subtitle">Biweekly · Flexible</div>
                            </div>
                        </div>
                        <div class="bill-card-right">
                            <div class="bill-card-amount-wrap">
                                <span>$</span>
                                <input type="number" class="bill-amount-input" value="${Math.round(bill.amount)}" onchange="updateAmount('${bill.id}', this.value)" step="0.01">
                            </div>
                        </div>
                    `;
                } else {
                    const isOverdue = !!bill.isOverdue && !isPaid;
                    const billDate = bill.originalDate || new Date();
                    const monthStr = billDate.toLocaleDateString('en-US', { month: 'short' }).toUpperCase();
                    const dayStr = billDate.getDate();

                    let subtitle = `Due ${monthStr} ${dayStr}`;
                    if (bill.isPushed) subtitle = `${monthStr} ${dayStr} · Pushed`;
                    if (isOverdue) subtitle = `Overdue · Due ${monthStr} ${dayStr}`;

                    // Push / Return Button (only on unpaid bills)
                    let pushAction = '';
                    if (!isPaid) {
                        if (state.viewOffset === 0) {
                            pushAction = `<button class="push-btn" onclick="pushBill('${bill.id}')" title="Push to next cycle">&raquo;</button>`;
                        } else if (state.viewOffset === 1 && bill.isPushed) {
                            pushAction = `<button class="push-btn push-btn-return" onclick="unpushBill('${bill.id}')" title="Move back to current cycle">&laquo;</button>`;
                        }
                    }

                    const checkOverlay = isPaid ? `<div style="position:absolute; width:100%; height:100%; background:rgba(46,160,67,0.85); border-radius:10px; display:flex; align-items:center; justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>` : '';

                    card.innerHTML = `
                        <div class="bill-card-left">
                            <div class="date-tile" style="position:relative;" onclick="togglePaid('${bill.id}')" title="Click to mark as ${isPaid ? 'unpaid' : 'paid'}">
                                ${checkOverlay}
                                <span class="date-tile-month">${monthStr}</span>
                                <span class="date-tile-day">${dayStr}</span>
                            </div>
                            <div class="bill-card-info" onclick="togglePaid('${bill.id}')" style="cursor:pointer;">
                                <div class="bill-card-name ${isOverdue ? 'overdue-text' : ''}">${bill.name}</div>
                                <div class="bill-card-subtitle ${isOverdue ? 'overdue-text' : ''}">${subtitle}</div>
                            </div>
                        </div>
                        <div class="bill-card-right">
                            <div class="bill-card-amount-wrap">
                                <span>$</span>
                                <input type="number" class="bill-amount-input" value="${Math.round(bill.amount)}" onchange="updateAmount('${bill.id}', this.value)" step="0.01">
                            </div>
                            ${pushAction}
                        </div>
                    `;
                }
                return card;
            };

            // 1. Group: WEEKLY (unpaid biweekly flexible bills)
            if (unpaidWeekly.length > 0) {
                const weeklyHeader = document.createElement('div');
                weeklyHeader.className = 'section-group-label';
                weeklyHeader.innerText = 'Weekly';
                listEl.appendChild(weeklyHeader);

                unpaidWeekly.forEach(bill => {
                    listEl.appendChild(renderBillCard(bill, false));

            // 2. Group: UPCOMING (unpaid monthly scheduled bills)

                upcomingHeader.className = 'section-group-label';
                upcomingHeader.innerText = 'Upcoming';

            // 3. Group: PAID (all paid bills moved down to bottom of the list)
            if (paidBills.length > 0) {

                paidHeader.className = 'section-group-label';
                paidHeader.innerText = 'Paid';

                paidBills.forEach(bill => {

            recalculateCashFlow();
            saveStateToLocalStorage();

        // --- 6. LIVE INTEGRATION SYSTEM ---
        async function executeLiveTextQuery() {
            const queryInput = document.getElementById("gemini-input");
            const queryText = queryInput ? queryInput.value.trim() : "";
            if (!queryText) return;

            const container = document.getElementById("ai-response-container");
            container.innerHTML = `<div class="ai-output-card">Processing query...</div>`;

            const msPerDay = 1000 * 60 * 60 * 24;
            const formatDate = (d) => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

            const cyclesSummary = [0, 1, 2].map(offset => {
                const start = new Date(state.cycleStart.getTime() + (offset * 14 * msPerDay));
                const end = new Date(state.cycleStart.getTime() + ((offset + 1) * 14 * msPerDay));
                const cycleData = getExpensesForViewedCycle(offset);
                const startingInc = offset === 0 ? state.currentBalance : 0;
                const remaining = startingInc - cycleData.total;
                let title = "Current cycle";
                if (offset === 1) title = "Next cycle";
                else if (offset === 2) title = "Following cycle";
                const billsListStr = cycleData.list.map(b => `${b.name}: $${Math.round(b.amount)}`).join(", ");
                const summary = offset === 0
                    ? `Income $${Math.round(startingInc)}, Bills Due $${Math.round(cycleData.totalBillsSum)}, Remaining $${Math.round(remaining)}`
                    : `Upcoming Bills $${Math.round(cycleData.totalBillsSum)}`;
                return `${title} (${formatDate(start)} - ${formatDate(end)}): ${summary}. Bills: [${billsListStr}]`;
            }).join('\n');

            const financialContext = `
                User Financial Context:
                ${cyclesSummary}

                Currently Viewing: ${state.viewOffset === 0 ? 'Current cycle' : (state.viewOffset === 1 ? 'Next cycle' : 'Following cycle')}
                Days Remaining in Current Cycle: ${state.daysRemaining}
                User Financial Query: "${queryText}"

                Instructions: Answer the user's financial question directly, concisely, and accurately based on the context provided.
            `;

            let apiKey = getApiKey();
            if (!apiKey || apiKey === "YOUR_GEMINI_API_KEY") {
                promptNewApiKey();
                return;
            }

            const modelsToTry = ['gemini-3.5-flash', 'gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-flash'];
            let lastError = null;
            let success = false;

            for (const modelName of modelsToTry) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: financialContext }] }]
                        })
                    });
                    const resJson = await response.json();
                    if (resJson.candidates && resJson.candidates[0] && resJson.candidates[0].content) {
                        const resultText = resJson.candidates[0].content.parts[0].text;
                        container.innerHTML = `<div class="ai-output-card">${resultText}</div>`;
                        success = true;
                        break;
                    } else if (resJson.error) {
                        lastError = resJson.error;
                    }
                } catch (e) {
                    console.warn(`Model ${modelName} fetch error:`, e);
                }
            }

            if (!success) {
                const errMsg = lastError ? lastError.message : "API Request failed.";
                console.error("Gemini query failed:", lastError);
                container.innerHTML = `
                    <div class="ai-output-card" style="color:var(--danger-color)">
                        <strong>Gemini API Error:</strong> ${errMsg}
                        <br><br>
                        <em>Tip: Get a free key starting with <strong>AIzaSy...</strong> from <a href="https://aistudio.google.com/app/apikey" target="_blank" style="color:#4a90e2; text-decoration:underline;">Google AI Studio</a>.</em>
                        <br><br>
                        <button onclick="promptNewApiKey()" style="font-size:0.85em; padding:6px 12px; cursor:pointer; background:var(--text-main); color:var(--bg-color); border:none; border-radius:6px; font-weight:600;">🔑 Enter New Gemini API Key</button>
                    </div>
                `;
            }
            if (queryInput) queryInput.value = "";
        }

        // --- 7. VOICE-TO-TEXT ENGINE ---
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        async function toggleVoiceRecording() {
            const btn = document.getElementById('voice-btn');

            if (isRecording) {
                mediaRecorder.stop();
                btn.classList.remove('recording');
                btn.innerText = "Voice input";
                isRecording = false;
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (event) => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        await processAudioWithGemini(audioBlob);
                    };

                    mediaRecorder.start();
                    btn.classList.add('recording');
                    btn.innerText = "Recording...";
                    isRecording = true;
                } catch (err) {
                    console.error("Microphone access denied or failed.", err);
                    alert("Unable to access microphone.");
                }
            }
        }

        async function processAudioWithGemini(audioBlob) {
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = async () => {
                const base64Audio = reader.result.split(',')[1];
                document.getElementById('gemini-input').value = "Processing audio...";

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${getApiKey()}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: "Transcribe the following audio strictly into text. Do not add any other conversational filler. If it is a financial query, structure it clearly." },
                                    { inlineData: { mimeType: "audio/webm", data: base64Audio } }
                                ]
                            }]
                        })
                    });

                    const data = await response.json();
                    if (data.candidates && data.candidates[0]) {
                        const transcription = data.candidates[0].content.parts[0].text;
                        document.getElementById('gemini-input').value = transcription.trim();
                    } else {
                        document.getElementById('gemini-input').value = "Error: Could not transcribe audio.";
                    }
                } catch (error) {
                    console.error("API Error:", error);
                    document.getElementById('gemini-input').value = "Connection error to Gemini API.";
                }
            };
        }

                    { name: 'Warm', bg: '#f4f3f0', surface: '#f4f3f0', surface2: '#f4f3f0', accent: '#111111', onAccent: '#f4f3f0', textHi: '#111111', text: '#444444', dim: '#777777', hr: '#111111' }
                ]
            },
            minimal_dark: {
                name: 'Min Flat',
                subs: [
                    { name: 'Dark', bg: '#1a1a1a', surface: '#1a1a1a', surface2: '#1a1a1a', accent: '#e4e2dd', onAccent: '#1a1a1a', textHi: '#e4e2dd', text: '#999999', dim: '#777777', hr: '#e4e2dd' },
                    { name: 'OLED', bg: '#000000', surface: '#000000', surface2: '#000000', accent: '#ffffff', onAccent: '#000000', textHi: '#ffffff', text: '#aaaaaa', dim: '#555555', hr: '#ffffff' }
                ]
            }
        };

        const themeList = {
            'default': { id: 'default', name: 'Default' },
            'minimal-light': { id: 'minimal-light', name: 'Minimal Light', theme: 'minimal', subIndex: 0 },
            'minimal-warm': { id: 'minimal-warm', name: 'Minimal Warm', theme: 'minimal', subIndex: 1 },
            'minimal-dark': { id: 'minimal-dark', name: 'Minimal Dark', theme: 'minimal_dark', subIndex: 0 },
            'minimal-oled': { id: 'minimal-oled', name: 'Minimal OLED', theme: 'minimal_dark', subIndex: 1 }
        };

        function applyTheme(themeKey) {
            const activeTheme = themeList[themeKey] || themeList['default'];
            const root = document.documentElement;

            ['--bg', '--surface', '--surface2', '--accent', '--on-accent', '--text-hi', '--text', '--dim', '--hr'].forEach(v => root.style.removeProperty(v));

            if (activeTheme.id === 'default') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', activeTheme.theme);
                const sub = THEMES[activeTheme.theme].subs[activeTheme.subIndex];
                root.style.setProperty('--bg', sub.bg);
                root.style.setProperty('--surface', sub.surface);
                root.style.setProperty('--surface2', sub.surface2);
                root.style.setProperty('--accent', sub.accent);
                root.style.setProperty('--on-accent', sub.onAccent);
                root.style.setProperty('--text-hi', sub.textHi);
                root.style.setProperty('--text', sub.text);
                root.style.setProperty('--dim', sub.dim);
                root.style.setProperty('--hr', sub.hr);
            }

            const selectEl = document.getElementById('theme-select');
            if (selectEl) {
                selectEl.value = activeTheme.id;
            }

            localStorage.setItem('budget-theme-key', activeTheme.id);
        }

        function changeTheme(themeKey) {
            applyTheme(themeKey);
        }

        // Toggles the combined Gemini tools + settings panel
        function toggleSettingsMenu() {
            const panel = document.getElementById('expanded-panel');
            const btn = document.getElementById('settings-toggle-btn');
            const icon = document.getElementById('sparkle-icon');
            if (panel.style.display === 'none' || !panel.style.display) {
                panel.style.display = 'flex';
                btn.style.color = 'var(--text-main)';
                icon.style.transform = 'rotate(180deg)';
            } else {
                panel.style.display = 'none';
                btn.style.color = 'var(--text-dim)';
                icon.style.transform = 'rotate(0deg)';
            }
        }

        // --- 9. FONT SIZE ENGINE CONFIGURATION ---
        const SIZES = {
            'normal': 1.1,
            'large': 1.35,
            'huge': 1.6
        };

        function applySize(sizeKey) {
            const scale = SIZES[sizeKey] || 1.1;
            const root = document.documentElement;
            root.style.setProperty('--fs-scale', scale);

            ['normal', 'large', 'huge'].forEach(s => {
                const btn = document.getElementById(`btn-size-${s}`);
                if (btn) {
                    if (s === sizeKey) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                }
            });

            localStorage.setItem('budget-size-key', sizeKey);
        }

        function changeSize(sizeKey) {
            applySize(sizeKey);
        }

        function parseTimestamp(val) {
            if (!val) return 0;
            if (typeof val === 'string' || typeof val === 'number') {
                const t = new Date(val).getTime();
                return isNaN(t) ? 0 : t;
            }
            if (val.toDate && typeof val.toDate === 'function') {
                return val.toDate().getTime();
            }
            if (val.seconds !== undefined) {
                return val.seconds * 1000;
            }
            const t = new Date(val).getTime();
            return isNaN(t) ? 0 : t;
        }

        function saveStateToLocalStorage() {
            try {
                const data = {
                    currentBalance: state.currentBalance,
                    biweeklyExpenses: state.biweeklyExpenses,
                    monthlyExpenses: state.monthlyExpenses,
                    deferredBills: state.deferredBills,
                    paidBills: state.paidBills,
                    customAmounts: state.customAmounts || {},
                    updatedAt: new Date().toISOString()
                };
                localStorage.setItem('simplemoney-state-data', JSON.stringify(data));
                console.log("Saved state to localStorage:", data);
            } catch (e) {
                console.error("Error saving state to localStorage:", e);
            }
        }

        function loadStateFromLocalStorage() {
            try {
                const s = localStorage.getItem('simplemoney-state-data');
                if (s) {
                    const data = JSON.parse(s);
                    console.log("Loaded state from localStorage:", data);
                    if (data.currentBalance !== undefined) {
                        state.currentBalance = data.currentBalance;
                        const balInput = document.getElementById("balance-input");
                        if (balInput) balInput.value = state.currentBalance;
                    }
                    if (data.biweeklyExpenses) state.biweeklyExpenses = data.biweeklyExpenses;
                    if (data.monthlyExpenses) state.monthlyExpenses = data.monthlyExpenses;
                    if (data.deferredBills) state.deferredBills = data.deferredBills;
                    if (data.paidBills) state.paidBills = data.paidBills;
                    if (data.customAmounts) state.customAmounts = data.customAmounts;
                }
            } catch (e) {
                console.error("Error loading state from localStorage:", e);
            }
        }

        // --- INIT ---
        loadStateFromLocalStorage();
        updateCycleEngine();
        recalculateCashFlow();

        try {
            const savedTheme = localStorage.getItem('budget-theme-key');
            if (savedTheme && themeList[savedTheme]) {
                applyTheme(savedTheme);
            } else {
                applyTheme('default');
            }
        } catch (e) {
            applyTheme('default');
        }

        try {
            const savedSize = localStorage.getItem('budget-size-key');
            if (savedSize && SIZES[savedSize]) {
                applySize(savedSize);
            } else {
                applySize('normal');
            }
        } catch (e) {
            applySize('normal');
        }

        // --- PWA SERVICE WORKER REGISTRATION ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(registration => {
                    console.log('SW registered: ', registration);
                }).catch(registrationError => {
                    console.log('SW registration failed: ', registrationError);
                });
            });
        }
    </script>

    <!-- Initialize Firebase Auth, Firestore, and Storage -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
        import { getStorage, ref, uploadBytes, getDownloadURL, listAll } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDyW2mNr3wOXjVYAPH75igXzKuiPJHVRrU",
            authDomain: "simplemoney-9a580.firebaseapp.com",
            projectId: "simplemoney-9a580",
            storageBucket: "simplenote-10e1b.firebasestorage.app",
            messagingSenderId: "24565452816",
            appId: "1:24565452816:web:e36de95c0760fd70ac7a95",
            measurementId: "G-G6LJRY0YE3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const storage = getStorage(app);
        const googleProvider = new GoogleAuthProvider();

        let currentUser = null;
        let userId = localStorage.getItem('simplemoney_user_id');
        if (!userId) {
            userId = 'guest_' + Math.random().toString(36).substring(2, 11);
            localStorage.setItem('simplemoney_user_id', userId);
        }

        // Listen for Auth state changes
        onAuthStateChanged(auth, async (user) => {
            const userEmail = document.getElementById('user-email');
            const userAvatar = document.getElementById('user-avatar');
            const authBtnText = document.getElementById('auth-btn-text');

            if (user) {
                currentUser = user;
                userId = user.uid;
                if (userEmail) userEmail.textContent = user.email || user.displayName;
                if (userAvatar) {
                    userAvatar.src = user.photoURL || '';
                    userAvatar.style.display = user.photoURL ? 'inline-block' : 'none';
                }
                if (authBtnText) authBtnText.textContent = 'Sign Out';
                console.log("Logged in user:", user.email, user.uid);
                loadStateFromFirebase();
                loadUserReceipts();
            } else {
                currentUser = null;
                userId = 'guest_' + (localStorage.getItem('simplemoney_user_id') || Math.random().toString(36).substring(2, 11));
                if (userEmail) userEmail.textContent = 'Guest Mode';
                if (userAvatar) userAvatar.style.display = 'none';
                if (authBtnText) authBtnText.textContent = 'Sign in with Google';
                console.log("Guest Mode / Logged out");
                loadStateFromFirebase();
            }
        });

        // Google Authentication handler
        window.handleAuthAction = async function() {
            if (auth.currentUser) {
                try {
                    await signOut(auth);
                } catch (e) {
                    console.error("Error signing out:", e);
                }
            } else {
                try {
                    await signInWithPopup(auth, googleProvider);
                } catch (error) {
                    console.error("Authentication error:", error);
                    alert("Sign in failed: " + error.message);
                }
            }
        };

        const authBtn = document.getElementById('auth-action-btn');
        if (authBtn) {
            authBtn.addEventListener('click', window.handleAuthAction);
        }

        // Expose save function to window
        window.saveStateToFirebase = async function() {
            try {
                await setDoc(doc(db, "users", userId), {
                    currentBalance: state.currentBalance,
                    biweeklyExpenses: state.biweeklyExpenses,
                    monthlyExpenses: state.monthlyExpenses,
                    deferredBills: state.deferredBills,
                    paidBills: state.paidBills,
                    customAmounts: state.customAmounts || {},
                    updatedAt: new Date().toISOString()
                });
                console.log("State saved to Firestore for user:", userId);
            } catch (e) {
                console.error("Error saving state to Firestore:", e);
            }
        };

        // Load state from Firestore on startup.
        // Local state (already loaded from localStorage) is the safe fallback.
        // Remote only wins if it is STRICTLY newer AND has actual content —
        // empty arrays are truthy in JS, so without this check Firebase can
        // wipe paid bills / custom amounts with an empty doc on refresh.
        async function loadStateFromFirebase() {
            try {
                const docRef = doc(db, "users", userId);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const remoteData = docSnap.data();

                    let localData = null;
                    try {
                        const s = localStorage.getItem('simplemoney-state-data');
                        if (s) localData = JSON.parse(s);
                    } catch (e) {}

                    const remoteTime = parseTimestamp(remoteData.updatedAt);
                    const localTime  = localData ? parseTimestamp(localData.updatedAt) : 0;

                    const remoteHasContent = !!(
                        (remoteData.currentBalance && remoteData.currentBalance !== 0) ||
                        (remoteData.paidBills     && remoteData.paidBills.length > 0) ||
                        (remoteData.deferredBills && remoteData.deferredBills.length > 0) ||
                        (remoteData.customAmounts && Object.keys(remoteData.customAmounts).length > 0)
                    );

                    if (remoteTime > localTime && remoteHasContent) {
                        // Remote is strictly newer with real data — pull it down
                        console.log("Remote newer with content — applying.");
                        if (remoteData.currentBalance !== undefined) {
                            state.currentBalance = remoteData.currentBalance;
                            const balInput = document.getElementById("balance-input");
                            if (balInput) balInput.value = state.currentBalance;
                        }
                        if (remoteData.biweeklyExpenses) state.biweeklyExpenses = remoteData.biweeklyExpenses;
                        if (remoteData.monthlyExpenses)  state.monthlyExpenses  = remoteData.monthlyExpenses;
                        if (remoteData.deferredBills)    state.deferredBills    = remoteData.deferredBills;
                        if (remoteData.paidBills)        state.paidBills        = remoteData.paidBills;
                        if (remoteData.customAmounts)    state.customAmounts    = remoteData.customAmounts;

                        recalculateCashFlow();
                        try {
                            localStorage.setItem('simplemoney-state-data', JSON.stringify({
                                currentBalance:    state.currentBalance,
                                biweeklyExpenses:  state.biweeklyExpenses,
                                monthlyExpenses:   state.monthlyExpenses,
                                deferredBills:     state.deferredBills,
                                paidBills:         state.paidBills,
                                customAmounts:     state.customAmounts || {},
                                updatedAt:         remoteData.updatedAt || new Date().toISOString()
                            }));
                        } catch (err) {}
                    } else {
                        // Local is newer or equal — push local up; never overwrite with stale/empty remote
                        console.log("Local newer or equal — pushing to remote.");
                        if (window.saveStateToFirebase) window.saveStateToFirebase();
                    }
                } else {
                    // No Firebase doc yet — push local state up
                    if (window.saveStateToFirebase) window.saveStateToFirebase();
                }
            } catch (e) {
                // Firebase unavailable — local state already loaded, nothing lost
                console.error("Firebase load error (local state preserved):", e);
            }
        }

        // Firebase Storage: Upload Receipt
        window.uploadSelectedReceipt = async function() {
            const fileInput = document.getElementById('receipt-file-input');
            const statusDiv = document.getElementById('receipt-upload-status');
            if (!fileInput || !fileInput.files[0]) {
                alert("Please select a file to upload.");
                return;
            }
            const file = fileInput.files[0];
            if (statusDiv) statusDiv.textContent = "Uploading " + file.name + "...";

            try {
                const storageRef = ref(storage, `receipts/${userId}/${Date.now()}_${file.name}`);
                await uploadBytes(storageRef, file);
                const downloadUrl = await getDownloadURL(storageRef);
                if (statusDiv) statusDiv.textContent = "Upload successful!";
                fileInput.value = "";
                loadUserReceipts();
            } catch (err) {
                console.error("Storage upload error:", err);
                if (statusDiv) statusDiv.textContent = "Upload failed: " + err.message;
            }
        };

        // Firebase Storage: Load User Receipts
        window.loadUserReceipts = async function() {
            const receiptsList = document.getElementById('receipts-list');
            if (!receiptsList) return;
            try {
                const listRef = ref(storage, `receipts/${userId}`);
                const res = await listAll(listRef);
                if (res.items.length === 0) {
                    receiptsList.innerHTML = `<span style="color: var(--text-dim);">No uploaded receipts.</span>`;
                    return;
                }
                receiptsList.innerHTML = "";
                for (const itemRef of res.items) {
                    const url = await getDownloadURL(itemRef);
                    const itemDiv = document.createElement('div');
                    itemDiv.style.cssText = "display: flex; justify-content: space-between; align-items: center;";
                    itemDiv.innerHTML = `<a href="${url}" target="_blank" style="color: #4a90e2; text-decoration: underline;">📄 ${itemRef.name.replace(/^\d+_/, '')}</a>`;
                    receiptsList.appendChild(itemDiv);
                }
            } catch (e) {
                console.log("No receipts found or storage uninitialized:", e);
            }
        };

        // onAuthStateChanged (above) triggers loadStateFromFirebase — no duplicate call needed
    </script>
